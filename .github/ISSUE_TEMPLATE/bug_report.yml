name: Bug report
description: Report a reproducible problem with ModelFit.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and a safe redacted error message.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private information from logs/screenshots.
          required: true
