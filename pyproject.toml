[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelfit"
version = "0.1.0"
description = "Local AI model hardware-fit estimates from public model metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ModelFit contributors" }]
keywords = ["ollama", "llm", "hardware", "gpu", "cli"]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
modelfit = "modelfit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelfit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
